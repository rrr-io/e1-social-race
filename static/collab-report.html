<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Collab report</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="/common.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/collab.css">
<script defer src="/common.js"></script>
<script defer src="/collab-report.js"></script>
</head>
<body>
<header class="topbar"><span class="brand"><span class="brand-mark" aria-hidden="true">E1</span><span>Collab report</span></span></header>
<main>
  <div class="head-row"><h2 id="title">Collab report</h2>
    <span class="head-actions"><button id="refresh" class="btn-ghost" type="button">Refresh</button><button id="csv" class="btn-ghost" type="button">Download CSV</button></span></div>
  <p id="subtitle" class="section-note"></p>
  <div id="gone" class="banner is-error" role="alert" hidden><div><strong>This link is not valid</strong><p id="gone-text"></p></div></div>
  <section id="content" hidden>
    <h3 class="sub">All days</h3>
    <div id="tiles" class="tiles"></div>
    <h3 class="sub">Day by day</h3>
    <div class="scroll"><table id="days-table"><thead><tr><th>Proofs date</th><th class="num">Valid proofs</th><th class="num">Files</th><th class="num">Duplicates</th><th class="num">Not ENHYPEN</th><th class="num">Wrong partner image</th><th class="num">To verify</th><th class="num">Rejected</th><th>Report</th></tr></thead><tbody id="days-body"></tbody></table></div>
    <p class="section-note"><strong>Open</strong> shows the report of that day: its doubtful and rejected proofs, which can be accepted or rejected there.</p>
  </section>
</main>
</body>
</html>
